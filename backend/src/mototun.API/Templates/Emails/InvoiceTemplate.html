<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #dbe3ef;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px;background:#7c2d12;color:#ffffff;">
                <div style="font-size:12px;letter-spacing:1.6px;text-transform:uppercase;opacity:0.88;">Tunimoto</div>
                <div style="margin-top:10px;font-size:28px;font-weight:700;line-height:1.2;">Invoice created</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px 0;font-size:16px;line-height:1.7;">Hello {{USER_NAME}},</p>
                <p style="margin:0 0 16px 0;font-size:16px;line-height:1.7;">{{MESSAGE}}</p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin-top:20px;border-collapse:collapse;">
                  <tr>
                    <td style="padding:12px 14px;border:1px solid #e2e8f0;font-size:14px;font-weight:700;background:#f8fafc;">Invoice</td>
                    <td style="padding:12px 14px;border:1px solid #e2e8f0;font-size:14px;">{{INVOICE_ID}}</td>
                  </tr>
                  <tr>
                    <td style="padding:12px 14px;border:1px solid #e2e8f0;font-size:14px;font-weight:700;background:#f8fafc;">Amount</td>
                    <td style="padding:12px 14px;border:1px solid #e2e8f0;font-size:14px;">{{AMOUNT}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.7;color:#64748b;">
                This email was sent automatically by Tunimoto.<br />
                &copy; {{CURRENT_YEAR}} Tunimoto
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
