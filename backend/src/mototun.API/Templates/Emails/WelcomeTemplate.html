<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #d8e0eb;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px;background:#14532d;color:#ffffff;">
                <div style="font-size:12px;letter-spacing:1.6px;text-transform:uppercase;opacity:0.88;">Tunimoto</div>
                <div style="margin-top:10px;font-size:28px;font-weight:700;line-height:1.2;">Welcome aboard</div>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px 0;font-size:16px;line-height:1.7;">Hello {{USER_NAME}},</p>
                <p style="margin:0 0 16px 0;font-size:16px;line-height:1.7;">{{MESSAGE}}</p>
                <p style="margin:0;font-size:15px;line-height:1.7;color:#475569;">Tunimoto helps you manage users, invoices, follow-ups, and document workflows in one secure place.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.7;color:#64748b;">
                Thank you for choosing Tunimoto.<br />
                &copy; {{CURRENT_YEAR}} Tunimoto
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
